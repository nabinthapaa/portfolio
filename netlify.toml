[build]
  command = "yarn build"

[build.environment]
  # Keep in sync with .nvmrc. Netlify's default is older than the tree allows:
  # camera-controls (via drei) and @netlify/edge-functions both require >= 22.
  NODE_VERSION = "22"

# Builds Next in standalone mode and serves it from a function. Prerendered
# pages are still served from the CDN (the handler sets preferStatic), so only
# /api/* actually invokes it.
[[plugins]]
  package = "@netlify/plugin-nextjs"
